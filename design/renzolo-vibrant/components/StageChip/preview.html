<!-- @dsCard group="Method" height=150 subtitle="Founder Trajectory™ stages" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StageChip — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:var(--space-6);}
  .strip{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:var(--space-2);font:600 15px/20px var(--font-sans);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4) var(--space-2) var(--space-2);border:2px solid var(--ink);background:var(--surface-raised);color:var(--ink);}
  .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-pill);background:var(--surface-tint);font:800 14px/1 var(--font-display);}
  .done{background:var(--teal);color:var(--on-teal);}
  .done .n{background:var(--surface-raised);color:var(--ink);}
  .active{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-pop);}
  .active .n{background:var(--ink);color:var(--surface);}
  .arrow{color:var(--ink-muted);font-weight:700;}
  .bar{margin-top:var(--space-6);height:10px;border-radius:var(--radius-pill);background:var(--surface-tint);overflow:hidden;max-width:520px;}
  .fill{height:100%;width:45%;background:var(--teal);border-radius:var(--radius-pill);}
  .cap{margin-top:var(--space-2);font:500 13px/18px var(--font-sans);color:var(--ink-muted);}
</style></head>
<body>
<div class="wrap">
  <div class="strip" role="list" aria-label="Founder Trajectory stages">
    <span class="chip done" role="listitem"><span class="n">1</span>Evaluate</span><span class="arrow" aria-hidden="true">→</span>
    <span class="chip active" role="listitem" aria-current="step"><span class="n">2</span>Evolve</span><span class="arrow" aria-hidden="true">→</span>
    <span class="chip" role="listitem"><span class="n">3</span>Execute</span><span class="arrow" aria-hidden="true">→</span>
    <span class="chip" role="listitem"><span class="n">4</span>Elevate</span>
  </div>
  <div class="bar"><div class="fill"></div></div>
  <div class="cap">Stage 2 of 4 · Evolve your plan from your assessment results</div>
</div>
</body>
</html>
