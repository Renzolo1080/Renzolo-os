<!-- @dsCard group="Data" height=470 subtitle="Live, stock-style Readiness Score (sample data)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ReadinessTicker — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);}
  .wrap{padding:var(--space-6);}
  .card{max-width:420px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--glow-brand);}
  .top{display:flex;justify-content:space-between;align-items:center;font:600 13px/18px var(--font-sans);color:var(--ink-muted);}
  .live{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--ink);}
  .dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--teal);}
  @media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s ease-in-out infinite;}}
  @keyframes pulse{50%{opacity:.35;transform:scale(.8);}}
  .score{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-3) 0 var(--space-1);}
  .num{font:600 44px/48px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .chg{font:500 14px/20px var(--font-mono);font-variant-numeric:tabular-nums;}
  .up{color:var(--tick-up);} .down{color:var(--tick-down);}
  .tabs{display:flex;gap:var(--space-1);margin:var(--space-4) 0 var(--space-2);}
  .tab{font:600 12px/16px var(--font-mono);border:1px solid var(--line);background:transparent;color:var(--ink-muted);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);cursor:pointer;}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--surface-raised);border-color:var(--ink);}
  .tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  svg{display:block;width:100%;height:72px;}
  .line{fill:none;stroke:var(--tick-up);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .area{fill:var(--teal);opacity:.12;}
  .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin:var(--space-4) 0;}
  .sub{background:var(--surface);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);}
  .lab{font:500 12px/16px var(--font-sans);color:var(--ink-muted);}
  .val{font:600 16px/22px var(--font-mono);font-variant-numeric:tabular-nums;}
  .movers{border-top:1px solid var(--line);padding-top:var(--space-3);}
  .mh{font:700 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);margin:0 0 var(--space-2);}
  .mv{display:flex;justify-content:space-between;gap:var(--space-3);font:400 14px/20px var(--font-sans);margin:0 0 var(--space-1);}
  .foot{margin-top:var(--space-3);font:500 12px/16px var(--font-sans);color:var(--ink-muted);}
</style></head>
<body>
<div class="wrap">
  <section class="card" aria-label="Readiness Score, sample data">
    <div class="top"><span class="live"><span class="dot" aria-hidden="true"></span>Live</span><span>Readiness Score</span></div>
    <div class="score"><span class="num" id="num">72.4</span><span class="chg up" id="chg">+1.8 ▲ (+2.5%)</span></div>
    <div class="tabs" role="group" aria-label="Time range">
      <button class="tab" data-r="1H" aria-pressed="false">1H</button><button class="tab" data-r="1D" aria-pressed="true">1D</button><button class="tab" data-r="1W" aria-pressed="false">1W</button><button class="tab" data-r="1M" aria-pressed="false">1M</button><button class="tab" data-r="1Y" aria-pressed="false">1Y</button>
    </div>
    <svg viewBox="0 0 300 72" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="area"/><path class="line" id="line"/></svg>
    <div class="subs">
      <div class="sub"><div class="lab">Customers</div><div class="val">78.1 <span class="up">+0.6 ▲</span></div></div>
      <div class="sub"><div class="lab">Capital</div><div class="val">69.3 <span class="up">+2.4 ▲</span></div></div>
      <div class="sub"><div class="lab">Investors</div><div class="val">61.0 <span class="down">−0.4 ▼</span></div></div>
    </div>
    <div class="movers">
      <p class="mh">Today's movers</p>
      <p class="mv"><span>September bank statement added</span><span class="chg up">+1.2</span></p>
      <p class="mv"><span>Pricing task completed</span><span class="chg up">+0.8</span></p>
      <p class="mv"><span>Investor deck overdue</span><span class="chg down">−0.4</span></p>
    </div>
    <div class="foot">Sample data · Updated 2 min ago · Sector index 64.8</div>
  </section>
</div>
<script>
  var D={'1H':[71.9,72,72,72.1,72.2,72.2,72.4],'1D':[70.6,70.6,71.1,71.3,71.8,72,72.4],'1W':[68.2,68.9,69.5,70.1,70.4,70.6,72.4],'1M':[61.5,63,64.2,66.8,68,70.6,72.4],'1Y':[44,49.5,53,58.2,63.4,68.9,72.4]};
  var C={'1H':'+0.5 ▲ (+0.7%)','1D':'+1.8 ▲ (+2.5%)','1W':'+4.2 ▲ (+6.2%)','1M':'+10.9 ▲ (+17.7%)','1Y':'+28.4 ▲ (+64.5%)'};
  function draw(r){var p=D[r],mn=Math.min.apply(0,p)-0.5,mx=Math.max.apply(0,p)+0.5,s='';
    p.forEach(function(v,i){var x=i*(300/(p.length-1)),y=68-(v-mn)/(mx-mn)*62;s+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});
    document.getElementById('line').setAttribute('d',s);document.getElementById('area').setAttribute('d',s+'L300 72L0 72Z');document.getElementById('chg').textContent=C[r];}
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(o){o.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');draw(b.dataset.r);});});
  draw('1D');
</script>
</body>
</html>
